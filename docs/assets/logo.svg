  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <rect x="14" y="14" width="228" height="228" rx="54" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
