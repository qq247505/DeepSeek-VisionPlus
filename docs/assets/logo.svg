    <path d="M74 126 C66 116 56 108 44 102 C30 95 16 94 8 99 C18 110 25 120 27 129 C25 138 18 148 8 159 C16 164 30 163 44 156 C56 150 66 142 74 132 Z" fill="url(#body)"/>
