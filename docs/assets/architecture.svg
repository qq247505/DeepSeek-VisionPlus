<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6b7c93"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="360" rx="16" fill="#0f172a"/>

  <!-- 用户 -->
  <rect x="30" y="140" width="130" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="95" y="176" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">用户</text>
  <text x="95" y="198" text-anchor="middle" fill="#94a3b8" font-size="12">输入框 / 发图</text>

  <!-- 插件适配器 -->
  <rect x="230" y="110" width="180" height="140" rx="12" fill="#172554" stroke="#1d4ed8"/>
  <text x="320" y="150" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="700">DeepSeek VisionPlus</text>
  <text x="320" y="174" text-anchor="middle" fill="#cbd5e1" font-size="12">路由适配器</text>
  <text x="320" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">有图？→ 视觉池</text>
  <text x="320" y="220" text-anchor="middle" fill="#94a3b8" font-size="11">无图 → DeepSeek</text>

  <!-- 文本 -->
  <rect x="510" y="80" width="170" height="90" rx="12" fill="#052e16" stroke="#15803d"/>
  <text x="595" y="118" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">DeepSeek 官方 API</text>
  <text x="595" y="144" text-anchor="middle" fill="#a7f3d0" font-size="12">文本 · 编码 · 推理</text>

  <!-- 视觉池 -->
  <rect x="510" y="205" width="330" height="120" rx="12" fill="#1e1b4b" stroke="#6d28d9"/>
  <text x="675" y="232" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">免费视觉模型池（顺序轮换）</text>
  <rect x="530" y="248" width="90" height="44" rx="8" fill="#312e81"/>
  <text x="575" y="275" text-anchor="middle" fill="#e0e7ff" font-size="12">智谱 GLM</text>
  <rect x="635" y="248" width="90" height="44" rx="8" fill="#312e81"/>
  <text x="680" y="275" text-anchor="middle" fill="#e0e7ff" font-size="12">Qwen 千问</text>
  <rect x="740" y="248" width="86" height="44" rx="8" fill="#312e81"/>
  <text x="783" y="275" text-anchor="middle" fill="#e0e7ff" font-size="12">自定义平台</text>

  <!-- 连线 -->
  <line x1="160" y1="180" x2="228" y2="180" stroke="#6b7c93" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="155" x2="508" y2="125" stroke="#6b7c93" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="215" x2="508" y2="265" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowV)"/>
  <text x="430" y="215" fill="#38bdf8" font-size="11">图片</text>
  <text x="430" y="148" fill="#94a3b8" font-size="11">文本</text>
</svg>